[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "graphsentinel"
version = "0.1.0"
description = "Evidence driven graph fraud investigations"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2,<3", "mcp>=1,<2"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]
analysis = ["duckdb>=1.4,<2"]
data = ["gdown>=5,<7"]

[tool.setuptools.packages.find]
include = ["graphsentinel*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
